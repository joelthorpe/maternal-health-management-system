<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clinic Reports</title>
  <link rel="stylesheet" href="css\style.css">

</head>
<body>
  <div class="navbar">
    <b onclick="location.href='00-MainPage.html'">Maternal Care</b>
    <a href="04-ReportsDashboard.html">Reports Dashboard</a>
    <span class="nav-separator"></span>
    <a href="04.1-JoelReports.html">Joel Reports</a>
    <a href="04.2-MartinReports.html">Martin Reports</a>
    <a href="04.3-AdamReports.html">Adam Reports</a>
    <a href="04.4-CameronReports.html">Cameron Reports</a>
    <a href="04.5-JonnyReports.html">Jonny Reports</a>
  </div>

  <div class="dashboard-bg">
    <div id="actionResult"></div>
    <div class="main layout">
        <div class="form">
            <h2>View Average Pregnancy Loss Rates by Village</h2>
            <form id="villageForm">
                <label for="village">Village</label>
                <select id="village" required></select>
                <button type="submit" id="btnSubmit">See Reports</button>
            </form>
            </form>
        </div>

        <div class="form">
          <h2>Average Pregnancy Loss Rates for selected Village</h2>
            <div class="table-wrapper">
              <div class="displayResults"></div>
            </div>
        </div>
    </div>
  </div>
  </div>
  <script src="js/script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      createDropdownOptions(document.getElementById("village"), "PatientVillage", "tblPatient", null, true);
    });

    const form = document.querySelector("#villageForm");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const village = document.querySelector("#village").value;
      //console.log(village);

      // Runs the query for the report
      const sql = `SELECT p.PatientVillage, c.ClinicName, SUM(p.PatientNoOfPregnancies) AS TotalPregnancies, SUM(p.PatientPreviousBirths) AS TotalBirths, SUM(p.PatientNoOfPregnancies - p.PatientPreviousBirths) AS TotalLoss FROM tblPatient p INNER JOIN tblClinic c ON p.ClinicID = c.ClinicID WHERE PatientVillage = "${village}" GROUP BY PatientVillage ORDER BY TotalLoss;`;
      const result = await runQuery(sql);

      //console.log(result);

      // If the query was ran successfully
      if (result && result.success) {
        const resultsDiv = document.querySelector('.displayResults');
        resultsDiv.innerHTML = '';

        const resultData = result.data;

        if(resultData.length === 0) {
          // This part should happen, but is added as a fallback
          resultsDiv.innerHTML = 'No data found for this report.'
        } else {
          const table = document.createElement('table');

          ///////////// HEADERS /////////////

          let headerRow = document.createElement('tr');

          // Loop through the attribute values of the first data object
          for (let key in resultData[0]) {
            // Create a table header element
            let tableHead = document.createElement('th');
            // Add the key value to the header element
            tableHead.textContent = key;
            // Append it to the header row
            headerRow.appendChild(tableHead);
          }

          // Add the header row to the table
          table.appendChild(headerRow);

          ///////////// TABLE ROWS /////////////

          // Loops through the data results
          for(let data of result.data)
          {
            // Initialises a table row for each of the data rows
            let tableRow = document.createElement('tr');

              // Loops through the entities to get the attributes
              for(let key in data){
                  let tableCol = document.createElement('td');
                  // Used to get the other pair value
                  tableCol.textContent = data[key];
                  // Appends each column to the current row
                  tableRow.appendChild(tableCol);
              }

              // Adds the whole row to the table
              table.appendChild(tableRow);
          }

          // Adds the table to the results section on the website
          resultsDiv.appendChild(table);
        }
      }
    });
  </script>
</body>
</html>
