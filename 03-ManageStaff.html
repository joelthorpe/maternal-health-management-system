<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Staff</title>
  <link rel="stylesheet" href="css\style.css">

</head>
<body>
  <div class="navbar">
    <b onclick="location.href='00-MainPage.html'">Maternal Care</b>
    <a href="01-ClinicAdminDashboard.html">Clinic Admin Dashboard</a>
    <span class="nav-separator"></span>
    <ul>
      <li><a href="#">Manage Clinics</a>
        <ul class="dropdown">
        <li><a href="02-ManageClinics.html">Add Clinics</a></li>
        <li><a href="02.1-ManageClinics.html">Delete Clinics</a></li>
        <li><a href="02.2-ManageClinics.html">Update Clinics</a></li>
      </ul>
      </li>
      <li><a href="#">Manage Staff</a>
      <ul class="dropdown">
        <li><a href="03-ManageStaff.html">Add Staff</a></li>
        <li><a href="03.1-ManageStaff.html">Delete Staff</a></li>
        <li><a href="03.2-ManageStaff.html">Update Staff</a></li>
      </ul></li>
    </ul>
    <a href="04-ClinicReports.html">Reports</a>
  </div>

  <div class="dashboard-bg">
    <div class="main layout">
        <div class="form">
            <h2>Add a New Staff Member</h2>
            <form id="staffForm">
                <!-- Staff ID input-->
                <label for="StaffID">Staff ID</label>
                <input type="text" id="StaffID" maxlength="4" readonly>
                <!-- Clinic ID input - drop down -->
                <label for="ClinicID">Clinic ID</label>
                <select id="ClinicID" required></select>
                <!-- Role ID input - drop down -->
                <label for="RoleID">Role ID</label>
                <select id="RoleID" required></select>
                <!-- Staff Forename input-->
                <label for="StaffForename">Forename</label>
                <input type="text" id="StaffForename" required>
                <!-- Staff Surname input-->
                <label for="StaffSurname">Surname</label>
                <input type="text" id="StaffSurname" required>
                <!-- Staff DOB input-->
                <label for="StaffDOB">Date of Birth</label>
                <input type="date" id="StaffDOB" required>
                <!-- Staff Email input-->
                <label for="StaffEmail">Email Address</label>
                <input type="email" id="StaffEmail" required>
                <!-- Staff Phone No input-->
                <label for="StaffPhoneNo">Phone Number</label>
                <input type="text" id="StaffPhoneNo" required>
                <button type="submit" id="btnSubmit">Save Staff</button>

                <!--<button type="button" id="btnCancel">Cancel Edit</button>-->
                <!-- Displays result from submitting the form, can be moved -->
                <div class="formResult" style="display: none;"></div>
            </form>
        </div>

        <div class="form">
            <h2>List of Staff Members</h2>
            <!-- Staff Table goes here-->
            <div id="tblOutput"></div>
            <!-- Possibly include buttons to edit and delete -->
            <!-- Edit sends details to the add patient form to allow editing - unhides cancel button -->
        </div>
    </div>
    <div id="actionResult"></div>
  </div>

<script src="js/script.js"></script>
<script>

  /////////////// PARAMETERS ////////////////

  // Select the div which the table of data will go into
  const divElement = document.getElementById("tblOutput");
  const messageDiv = document.getElementById("actionResult");
  const formName = document.getElementById("staffForm");
  const fields = ["StaffID","ClinicID","RoleID","StaffForename","StaffSurname","StaffDOB","StaffEmail","StaffPhoneNo"];
  const tableName = "tblStaff";

  // A portion of code that is ran when the web is loaded
  document.addEventListener("DOMContentLoaded", async () => {
    
    // Call the method to fill the div with data
    fillTable(divElement,tableName, fields, messageDiv);
    // Fills the dropdown with the specified htmlSelectElement and with the field and table name
    createDropdownOptions(document.getElementById("ClinicID"), "ClinicID", "tblClinic");
    createDropdownOptions(document.getElementById("RoleID"), "RoleID", "tblRole");
    // Fills the ClinicID input with the next ClinicID available
    presentLatestID(document.getElementById("StaffID"),tableName, "StaffID" ,"S");

    // Handles Form Submission
    formName.addEventListener("submit", async (event) => {
      event.preventDefault(); // Prevents page reload
      
      // Object to hold form data
      const formData = {};

      // Populates the formData with key:pair values
      for (let field of fields) {
          const value = formName.querySelector(`#${field}`).value.trim();
          formData[field] = value;
      }

      // Validation happens here - calls the function in script.js
      // Change method here to match the validation required
      const validationMessage = validateStaff(formData);
      if (validationMessage !== "PASS") {
          displayMessage(validationMessage, actionResult);
          return;
      }

      // Extracts the key and pair values from the object
      const fieldNames = Object.keys(formData);
      const fieldValues = Object.values(formData);
      
      // Adds singular quotes around values that aren't numbers
      // Done to prevent errors when inserting into MySQL
      const formattedValues = [];
      // Iterates over all the values in the object
      for (let value of fieldValues) {
          // If the value is not a number or a phone number (special case)
          if (isNaN(value)  || (typeof value === "string" && value.startsWith("+"))) {
              // Add singular quotes around the value
              formattedValues.push("'" + value + "'");
          } else {
              // Else, just submit the value as is
              formattedValues.push(value);
          }
      }

      // Builds the SQL query and runs
      const sql = `INSERT INTO ${tableName} (${fieldNames.join(', ')}) VALUES (${formattedValues.join(', ')});`;
      const result = await runQuery(sql);

      // If the query is successful, tell the user
      if (result && result.success) {
        alert("Record added successfully.");
        location.reload(); // Reloads the page
      } else {
          alert(result.error);
      }
    });
  })

</script>
</body>
</html>
