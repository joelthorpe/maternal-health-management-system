<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Clinics</title>
  <link rel="stylesheet" href="css\style.css">

</head>
<body>
  <div class="navbar">
    <b onclick="location.href='00-MainPage.html'">Maternal Care</b>
    <a href="01-ClinicAdminDashboard.html">Clinic Admin Dashboard</a>
    <span class="nav-separator"></span>
    <a href="02-ManageClinics.html">Manage Clinics</a>
    <a href="03-ManageStaff.html">Manage Staff</a>
    <a href="09-ManageRiskFactors.html">Manage Risk Factors</a>
  </div>

  <div class="dashboard-bg">
    <div id="actionResult"></div>
    <div class="main layout">
        <div class="form">
            <h2>Add a New Clinic</h2>
            <form id="clinicForm">
                <!-- Clinic ID input-->
                <label for="ClinicID">Clinic ID</label>
                <input type="text" id="ClinicID" maxlength="4" readonly>
                <!-- Region ID input - drop down -->
                <label for="RegionID">Region ID</label>
                <select id="RegionID" required></select>
                <!-- Clinic Name input-->
                <label for="ClinicName">Clinic Name</label>
                <input type="text" id="ClinicName" required>
                <!-- Clinic Capacity input-->
                <label for="ClinicCapacity">Clinic Capacity</label>
                <input type="number" id="ClinicCapacity" value="0" required>
                <ul id="btnList">
                  <li><button type="submit" id="btnSubmit">Save Record</button></li>
                </ul>
                
      
                <!--<button type="button" id="btnCancel">Cancel Edit</button>-->
            </form>
        </div>

        <div class="form">
            <h2>List of Clinics</h2>
            <!-- Clinics Table goes here-->
            <div class="table-wrapper">
              <div id="tblOutput"></div>
            </div>
            <!-- Possibly include buttons to edit and delete -->
            <!-- Edit sends details to the add patient form to allow editing - unhides cancel button -->
        </div>
    </div>
  </div>

<script src="js/script.js"></script>
<script>

  /////////////// PARAMETERS ////////////////

  // Select the div which the table of data will go into
  const divElement = document.getElementById("tblOutput");
  const messageDiv = document.getElementById("actionResult");
  const formName = document.getElementById("clinicForm");
  const fields = ["ClinicID","RegionID","ClinicName","ClinicCapacity"];
  const tableName = "tblClinic";
  const primaryKeyPrefix = "C";

  // A portion of code that is ran when the web is loaded
  document.addEventListener("DOMContentLoaded", async () => {
    
    // Call the method to fill the div with data
    fillTable(divElement,tableName, fields, messageDiv, primaryKeyPrefix,formName);
    // Fills the dropdown with the specified htmlSelectElement and with the field and table name
    createDropdownOptions(document.getElementById("RegionID"), "RegionID", "tblRegion");
    // Fills the ClinicID input with the next ClinicID available
    presentLatestID(document.getElementById("ClinicID"), tableName, "ClinicID", primaryKeyPrefix);

    handleFormSubmission(divElement, formName, fields, tableName, primaryKeyPrefix, validateClinic, messageDiv);
  })

</script>
</body>
</html>
