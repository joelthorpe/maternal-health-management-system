<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clinic Reports</title>
  <link rel="stylesheet" href="css\style.css">
  <style>
    canvas{
      size: auto;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <b onclick="location.href='00-MainPage.html'">Maternal Care</b>
    <a href="04-ReportsDashboard.html">Reports Dashboard</a>
    <span class="nav-separator"></span>
    <a href="04.1-JoelReports.html">Joel Reports</a>
    <a href="04.2-MartinReports.html">Martin Reports</a>
    <a href="04.3-AdamReports.html">Adam Reports</a>
    <a href="04.4-CameronReports.html">Cameron Reports</a>
    <a href="04.5-JonnyReports.html">Jonny Reports</a>
  </div>

  <div class="dashboard-bg">
    <div id="actionResult"></div>
    <div class="main layout">
        <div class="form">
            <h2>View Risk Distribution</h2>
            <form id="riskDistributionForm">
                <label for="RegionID">Region ID</label>
                <select id="RegionID" required></select>
                <button type="submit" id="btnSubmit">See Record</button>
            </form>
        </div>

        <div class="form">
          <h2>Risk Distribution</h2>
            <div class="displayCharts"></div>
        </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Gets the element where the element will be displayed
    const chartOutput = document.querySelector(".displayCharts");
    // The form used to select which region to display
    const form = document.querySelector("#riskDistributionForm");
    // Colours can be configured, this is a placeholder for now maybe
    const colours = ['red','blue','green','purple','yellow'];
  // A portion of code that is ran when the web is loaded
    document.addEventListener("DOMContentLoaded", async () => {
      createDropdownOptions(document.getElementById("RegionID"), "RegionID", "tblRegion");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      chartOutput.innerHTML = "";

      let risks = [];
      let riskAmount = [];
      let regionName = "";
      const regionID = document.querySelector("#RegionID");
      const sql = `SELECT rg.RegionName, rf.RiskName, COUNT(pr.RiskID) AS AmountIdentified FROM tblRegion rg CROSS JOIN tblRiskFactors rf LEFT JOIN tblClinic c ON c.RegionID = rg.RegionID LEFT JOIN tblPatient p ON p.ClinicID = c.ClinicID LEFT JOIN tblPatient_RiskFactors pr ON pr.PatientID = p.PatientID AND pr.RiskID = rf.RiskID WHERE rg.RegionID = "${regionID.value}" GROUP BY rg.RegionName, rf.RiskName ;` ;
      const result = await runQuery(sql);
      console.log(result);

      if(result && result.success)
      {
        for (let data of result.data){
        risks.push(data.RiskName);
        riskAmount.push(Number(data.AmountIdentified));
        regionName = data.RegionName;
      }

      let newChart = document.createElement("canvas");

        chartOutput.appendChild(newChart);

        // Creating the chart
        new Chart(newChart, {
          type: "pie",
          data: {
            labels: risks,
            datasets: [{
              backgroundColor: colours,
              data: riskAmount,
              borderColor: "black",
              borderWidth: 3
            }]
          },
          options: {
            plugins: {
              legend: {display:true,
                labels:{
                color:"white"
                }
              },
              title: {
                display: true,
                text: regionName,
                font: {size:16},
                color:"white"
              }
            }
          }
        });
      }
      else
      {
        chartOutput.textContent = "No Data Retrieved";
      }
      
    });
  </script>
</body>
</html>
