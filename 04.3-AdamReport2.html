  <div class="dashboard-bg">
    <div id="actionResult"></div>
    <button class="scroll-btn" onclick="scrollToContainer()">
      ↓ View Chart
    </button>
    <div class="main layout">
      <div class="form">
          <h2>Report Parameters</h2>
          <form id="reportForm">
            <label for="ReportYear">Year (leave blank for all years)</label>
            <input type="number" id="ReportYear" placeholder="e.g. 2025" min="2000" max="2100" step="1">

            <label for="SortDirection">Sort Direction</label>
            <select id="SortDirection">
              <option value="DESC" selected>Descending</option>
              <option value="ASC">Ascending</option>
            </select>

            <button type="submit">Run Report</button>
          </form>
        </div>

        <div class="form">
          <h2>Report Output</h2>
          <div class="table-wrapper">
            <div id="tblOutput"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="form" id="chartSection" style="margin-top: 20px; max-width: 100%; background: white;">
      <h2 style="font-family: 'Altone', sans-serif;">Chart Visualisation</h2>
      <div style="width: 100%; height: 400px;">
        <canvas id="reportChart"></canvas>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    function scrollToContainer() {
      const chartSection = document.getElementById('chartSection');
      chartSection.scrollIntoView({ behavior: 'smooth' });
    }

    const reportForm = document.getElementById("reportForm");
    const outputDiv = document.getElementById("tblOutput");
    const actionResult = document.getElementById("actionResult");
    const chartCanvas = document.getElementById("reportChart");
    let chartInstance = null;

    const showActionMessage = (text) => {
      actionResult.textContent = text;
      actionResult.style.display = "block";
    };

    const clearActionMessage = () => {
      actionResult.textContent = "";
      actionResult.style.display = "none";
    };

    const buildReportTable = (data) => {
      outputDiv.innerHTML = "";

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      ["Year", "Month", "Month Name", "Total Completed Appointments"].forEach((heading) => {
        const th = document.createElement("th");
        th.textContent = heading;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      if (!data || data.length === 0) {
        const emptyRow = document.createElement("tr");
        const emptyCell = document.createElement("td");
        emptyCell.colSpan = 4;
        emptyCell.textContent = "No results found.";
        emptyRow.appendChild(emptyCell);
        tbody.appendChild(emptyRow);
      } else {
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const yearCell = document.createElement("td");
          yearCell.textContent = row.Year || "";
          const monthCell = document.createElement("td");
          monthCell.textContent = row.Month || "";
          const monthNameCell = document.createElement("td");
          monthNameCell.textContent = row.MonthName || "";
          const totalCell = document.createElement("td");
          totalCell.textContent = row.TotalCompletedAppointments || 0;
          tr.appendChild(yearCell);
          tr.appendChild(monthCell);
          tr.appendChild(monthNameCell);
          tr.appendChild(totalCell);
          tbody.appendChild(tr);
        });
      }

      table.appendChild(tbody);
      outputDiv.appendChild(table);

      buildChart(data);
    };

    const buildChart = (data) => {
      if (!data || data.length === 0) {
        if (chartInstance) {
          chartInstance.destroy();
          chartInstance = null;
        }
        return;
      }

      const periodLabels = data.map((row) => `${row.Year || ""} ${row.MonthName || ""}`);
      const counts = data.map((row) => row.TotalCompletedAppointments || 0);

      if (chartInstance) {
        chartInstance.destroy();
      }

      const ctx = chartCanvas.getContext("2d");
      chartInstance = new Chart(ctx, {
        type: "bar",
        data: {
          labels: periodLabels,
          datasets: [
            {
              label: "Completed Appointments",
              data: counts,
              backgroundColor: "rgba(40, 167, 69, 0.7)",
              borderColor: "rgba(40, 167, 69, 1)",
              borderWidth: 2,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: "top",
            },
          },
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: "Completed Appointments",
              },
            },
            x: {
              title: {
                display: true,
                text: "Period",
              },
            },
          },
        },
      });
    };

    const runReport = async () => {
      clearActionMessage();
      const yearValue = document.getElementById("ReportYear").value.trim();
      const sortDirection = document.getElementById("SortDirection").value === "ASC" ? "ASC" : "DESC";

      const yearFilter = yearValue ? ` AND YEAR(a.AppointmentDateTime) = ${yearValue}` : "";
      const sql = `SELECT 
    YEAR(a.AppointmentDateTime) AS Year,
    MONTH(a.AppointmentDateTime) AS Month,
    MONTHNAME(a.AppointmentDateTime) AS MonthName,
    COUNT(a.AppointmentID) AS TotalCompletedAppointments
FROM tblAppointment a
INNER JOIN tblAppointment_Status s
    ON a.StatusID = s.StatusID
WHERE s.StatusName = 'Completed'${yearFilter}
GROUP BY YEAR(a.AppointmentDateTime), MONTH(a.AppointmentDateTime)
ORDER BY Year ${sortDirection}, Month ${sortDirection};`;

      const result = await runQuery(sql);
      if (!result || !result.success) {
        showActionMessage(result?.error || "Unable to run report.");
        outputDiv.innerHTML = "";
        return;
      }

      buildReportTable(result.data || []);
      if (!result.data || result.data.length === 0) {
        showActionMessage("No rows returned for these parameters.");
      }
    };

    document.addEventListener("DOMContentLoaded", async () => {
      reportForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        await runReport();
      });
      await runReport();
    });
  </script>
</body>
</html>
