<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Patient Risk Factors</title>
  <link rel="stylesheet" href="css\style.css">

</head>
<body>
  <div class="navbar">
    <b onclick="location.href='00-MainPage.html'">Maternal Care</b>
    <a href="05-MidwifeDashboard.html">Midwife Dashboard</a>
    <span class="nav-separator"></span>
    <a href="06-ManagePatients.html">Manage Patients</a>
    <a href="07-ManageAppointments.html">Manage Appointments</a>
    <a href="08-ManagePatientRiskFactors.html">Manage Patient Risk Factors</a>
  </div>

  <div class="midwife-dashboard-bg">
  <div id="actionResult"></div>
    <div class="main layout">
        <div class="form">
            <h2>Add a New Patient Risk Factor</h2>
            <form id="patientRiskFactorsForm">
                <!-- Patient Risk ID input-->
                <label for="PatientRiskID">Patient Risk ID</label>
                <input type="text" id="PatientRiskID" maxlength="4" readonly>
                <!-- Patient ID input-->
                <label for="PatientID">Patient ID</label>
                <select id="PatientID" required></select>
                <!-- Risk ID input-->
                <label for="RiskID">Risk ID</label>
                <select id="RiskID" required></select>
                <!-- Risk Severity input-->
                <label for="RiskSeverity">Risk Severity</label>
                <select id="RiskSeverity" required></select>
                <!-- Date Identified input-->
                <label for="DateIdentified">Date Identified</label>
                <input type="date" id="DateIdentified" required>
                <!-- Is Treated input-->
                <label for="IsTreated">Is Treated</label>
                <select id="IsTreated" required></select>
                
                <ul id="btnList">
                  <li><button type="submit" id="btnSubmit">Save Record</button></li>
                </ul>
            </form>
        </div>

        <div class="form">
          <h2>List of Patient Risk Factors</h2>
          <div id="tblOutput"></div>
        </div>
    </div>
  </div>

<script src="js/script.js"></script>
<script>
  const divElement = document.getElementById("tblOutput");
  const messageDiv = document.getElementById("actionResult");
  const formName = document.getElementById("patientRiskFactorsForm");
  const fields = ["PatientRiskID","PatientID","RiskID", "RiskSeverity", "DateIdentified", "IsTreated"];
  const tableName = "tblPatient_RiskFactors";
  const primaryKeyPrefix = "PR";

  /* Method to help with populating numerical dropdowns
    - elementId: The ID of the Element to fill
    - defaultText: The text to display to the user
    - min: The minimum (lower boundary) value to show in the dropdown
    - max: The maximum (upper boundary) value to show in the dropdown
  */
  const populateNumericDropdown = (elementId, defaultText, min, max) => {
    const dropdown = document.getElementById(elementId);

    // Clear existing options to prevent duplicates
    const defaultOption = document.createElement("option");
    defaultOption.value = '';
    defaultOption.textContent = defaultText;
    dropdown.appendChild(defaultOption);

    // Loop through provided range and populate dropdown options
    for (let i = min; i <= max; i++) {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = i;
      dropdown.appendChild(option);
    }
  }

  document.addEventListener("DOMContentLoaded", async () => {
    fillTable(divElement, tableName, fields, messageDiv, primaryKeyPrefix, formName);
    presentLatestID(document.getElementById("PatientRiskID"), tableName, "PatientRiskID", primaryKeyPrefix);
    
    createDropdownOptions(document.getElementById("PatientID"), "PatientID", "tblPatient", ["PatientForename", "PatientSurname"]);
    createDropdownOptions(document.getElementById("RiskID"), "RiskID", "tblRiskFactors");
    
    populateNumericDropdown("RiskSeverity", "Select a Risk Severity", 1, 10);
    populateNumericDropdown("IsTreated", "Select Treatment Status", 0, 1);

    handleFormSubmission(divElement, formName, fields, tableName, primaryKeyPrefix, validatePatientRiskFactors, messageDiv);
  })

</script>

</body>
</html>
