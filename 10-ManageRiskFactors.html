<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Risk Factors</title>
  <link rel="stylesheet" href="css\style.css">

</head>
<body>
  <div class="navbar">
    <b onclick="location.href='00-MainPage.html'">Maternal Care</b>
    <a href="01-ClinicAdminDashboard.html">Clinic Admin Dashboard</a>
    <span class="nav-separator"></span>
    <a href="02-ManageClinics.html">Manage Clinics</a>
    <a href="03-ManageStaff.html">Manage Staff</a>
    <a href="10-ManageRiskFactors.html">Manage Risk Factors</a>
  </div>

  <div class="dashboard-bg">
  <div id="actionResult"></div>
    <div class="main layout">
        <div class="form">
            <h2>Add a New Risk Factor</h2>
            <form id="riskFactorsForm">
                <!-- Risk ID input-->
                <label for="RiskID">Risk ID</label>
                <input type="text" id="RiskID" maxlength="4" readonly>
                <!-- Risk Name input-->
                <label for="RiskName">Risk Name</label>
                <input type="text" id="RiskName" required>
                <!-- Risk Description input-->
                <label for="RiskDescription">Risk Description</label>
                <input type="text" id="RiskDescription" required>
                
                <ul id="btnList">
                  <li><button type="submit" id="btnSubmit">Save Record</button></li>
                </ul>
            </form>
        </div>

        <div class="form">
          <h2>List of Risk Factors</h2>
          <div id="tblOutput"></div>
        </div>
    </div>
  </div>

<script src="js/script.js"></script>
<script>
  const divElement = document.getElementById("tblOutput");
  const messageDiv = document.getElementById("actionResult");
  const formName = document.getElementById("riskFactorsForm");
  const fields = ["RiskID","RiskName","RiskDescription"];
  const tableName = "tblRiskFactors";
  const primaryKeyPrefix = "RF";

  document.addEventListener("DOMContentLoaded", async () => {
    fillTable(divElement, tableName, fields, messageDiv, primaryKeyPrefix, formName);
    presentLatestID(document.getElementById("RiskID"), tableName, "RiskID", primaryKeyPrefix);

    handleFormSubmission(divElement, formName, fields, tableName, primaryKeyPrefix, validateRiskFactors, messageDiv);
  })

</script>
</body>
</html>
