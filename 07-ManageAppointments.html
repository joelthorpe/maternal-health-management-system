<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Appointments</title>
  <link rel="stylesheet" href="css\style.css">

</head>
<body>
  <div class="navbar">
    <b onclick="location.href='00-MainPage.html'">Maternal Care</b>
    <a href="05-MidwifeDashboard.html">Midwife Dashboard</a>
    <span class="nav-separator"></span>
    <a href="06-ManagePatients.html">Manage Patients</a>
    <a href="07-ManageAppointments.html">Manage Appointments</a>
    <a href="08-ManagePatientRiskFactors.html">Manage Patient Risk Factors</a>
    <a href="09-MidwifeReports.html">Reports</a>
  </div>

<div class="midwife-dashboard-bg">
  <div id="actionResult"></div>
    <div class="main layout">
        <div class="form">
            <h2>Add a New Appointment</h2>
            <form id="appointmentForm">
                <!-- Appointment ID input-->
                <label for="AppointmentID">Appointment ID</label>
                <input type="text" id="AppointmentID" maxlength="4" readonly>
                <!-- Staff ID input - drop down -->
                <label for="StaffID">Staff ID</label>
                <select id="StaffID" required></select>
                <!-- Patient ID input - drop down -->
                <label for="PatientID">Patient ID</label>
                <select id="PatientID" required></select>
                <!-- Appointment Date input-->
                <label for="AppointmentDateTime">Appointment Date & Time</label>
                <input type="datetime-local" id="AppointmentDateTime" required> <!-- https://www.w3schools.com/tags/att_input_type_datetime-local.asp -->
                <!-- Appointment Notes input-->
                <label for="AppointmentNotes">Appointment Notes</label>
                <input type="text" id="AppointmentNotes" required>
                <!-- Appointment Status input - drop down -->
                <label for="StatusID">Status ID</label>
                <select id="StatusID" required></select>

                <ul id="btnList">
                  <li><button type="submit" id="btnSubmit">Save Record</button></li>
                </ul>
                <!--<button type="submit" id="btnSubmit">Save Record</button>-->
                
      
                <!--<button type="button" id="btnCancel">Cancel Edit</button>-->
            </form>
        </div>

        <div class="form">
            <h2>List of Appointments</h2>
            <!-- Appointments Table goes here-->
            <div id="tblOutput"></div>
            <!-- Possibly include buttons to edit and delete -->
            <!-- Edit sends details to the add patient form to allow editing - unhides cancel button -->
        </div>
    </div>
</div>

<script src="js/script.js"></script>
<script>

  /////////////// PARAMETERS ////////////////

  // Select the div which the table of data will go into
  const divElement = document.getElementById("tblOutput");
  const messageDiv = document.getElementById("actionResult");
  const formName = document.getElementById("appointmentForm");
  const fields = ["AppointmentID","StaffID","PatientID","AppointmentDateTime","AppointmentNotes", "StatusID"];
  const tableName = "tblAppointment";
  const primaryKeyPrefix = "A";

  // A portion of code that is ran when the web is loaded
  document.addEventListener("DOMContentLoaded", async () => {
    
    // Call the method to fill the div with data
    fillTable(divElement,tableName, fields, messageDiv, primaryKeyPrefix,formName);
    // Fills the dropdown with the specified htmlSelectElement and with the field and table name
    createDropdownOptions(document.getElementById("StaffID"), "StaffID", "tblStaff", ["StaffForename", "StaffSurname"]);
    createDropdownOptions(document.getElementById("PatientID"), "PatientID", "tblPatient", ["PatientForename", "PatientSurname"]);
    createDropdownOptions(document.getElementById("StatusID"), "StatusID", "tblAppointment_Status");
    // Fills the AppointmentID input with the next AppointmentID available
    presentLatestID(document.getElementById("AppointmentID"), tableName, "AppointmentID", primaryKeyPrefix);

    handleFormSubmission(divElement, formName, fields, tableName, primaryKeyPrefix, validateAppointments, messageDiv);
  })

  
</script>
</body>
</html>
